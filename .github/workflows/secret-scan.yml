name: Secret scan

# Fails the build when a pull request or a push adds a secret.
#
# Only the new commits are scanned (the PR's commits, or the pushed range).
# Older history still contains credentials that were rotated and retired; it
# was deliberately not rewritten. Those findings are listed in .gitleaksignore
# so a full-history scan is clean as well.
#
# gitleaks runs as a pinned, checksum-verified release binary (the
# gitleaks-action needs a paid license for organisation repositories).

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Block local settings files
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)(\.claude/settings\.local\.json|\.env|\.env\.local|CLAUDE\.local\.md)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Local settings files must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual run: whole history of the ref, with the known findings in .gitleaksignore.
            range="$SHA"
            cfg_ref="$SHA"
          elif [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
            # Use the base branch's rules, so a PR cannot allowlist its own secret.
            cfg_ref="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${SHA}"
            cfg_ref="$PUSH_BEFORE"
          else
            # New branch or force push: commits not on any other remote branch.
            range="${SHA} --not --exclude=refs/remotes/origin/${REF_NAME} --remotes=origin"
            cfg_ref="$SHA"
          fi

          rules="$RUNNER_TEMP/rules"
          mkdir -p "$rules"
          for f in .gitleaks.toml .gitleaksignore; do
            git show "${cfg_ref}:${f}" > "$rules/$f" 2>/dev/null || : > "$rules/$f"
          done
          cfg_args=()
          if [ -s "$rules/.gitleaks.toml" ]; then cfg_args=(--config "$rules/.gitleaks.toml"); fi

          echo "Scanning: git log ${range}"
          git log --oneline -n 50 $range
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="$range" \
            ${cfg_args[@]+"${cfg_args[@]}"} \
            --gitleaks-ignore-path "$rules/.gitleaksignore" \
            --redact --no-banner --verbose --exit-code 1
