name: Secret scan

# Fails the build when a pull request or a push adds a secret.
#
# Only the new commits are scanned (the PR's commits, or the pushed range).
# Older history still contains credentials that were rotated and retired; it
# was deliberately not rewritten. Those findings are listed in .gitleaksignore
# so a full-history scan is clean as well.
#
# gitleaks runs as a pinned, checksum-verified release binary (the
# gitleaks-action needs a paid license for organisation repositories).

on:
  pull_request:
    # edited: re-run when a PR is retargeted to another base branch.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests share one group per PR, so a new push replaces the old run.
# Every push run gets its own group: a pending run in a shared group would be
# cancelled even with cancel-in-progress false, leaving a push unscanned.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('secret-scan-{0}', github.ref) || format('secret-scan-{0}', github.run_id) }}
  # Never cancel a push scan: each push has its own range.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    # A branch deletion has no commits to scan.
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Block local settings files
        run: |
          set -euo pipefail
          tracked=$(git ls-files \
            | grep -E '(^|/)(\.claude/(.*/)?[^/]*\.local\.json|\.env(\.[^/]*)?|\.envrc|[^/]*\.env|CLAUDE\.local\.md)$' \
            | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Local settings files must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          default="origin/${DEFAULT_BRANCH}"
          if [ "$EVENT" = "push" ] && [ "$PUSH_BEFORE" = "$SHA" ]; then
            echo "Push did not move ${REF_NAME} (${SHA}); nothing to scan."
            exit 0
          fi
          fast_forward=false
          if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
             && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null \
             && git merge-base --is-ancestor "$PUSH_BEFORE" "$SHA"; then
            fast_forward=true
          fi

          # The rules (.gitleaks.toml, .gitleaksignore) never come from commits
          # that have not been scanned: for a PR from its base, for a push from
          # the default branch (for a push to the default branch itself, from its
          # previous tip). So a rule change merged to development applies to PR
          # scans at once, but to push scans only once it is released to the
          # default branch; until then push scans use the built-in rules.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual run (maintainers only): whole history of the ref, with that
            # ref's own rules and the known findings in its .gitleaksignore.
            range="$SHA"
            cfg_ref="$SHA"
          elif [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
            cfg_ref="$PR_BASE"
          elif [ "$fast_forward" = true ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            range="${PUSH_BEFORE}..${SHA}"
            cfg_ref="$PUSH_BEFORE"
          elif [ "$fast_forward" = true ]; then
            # Commits already on the default branch were scanned there (a back-merge
            # of main must not re-scan main's history).
            range="${SHA} --not ${PUSH_BEFORE} ${default}"
            cfg_ref="$default"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            # New branch or force push: everything not yet on the default branch.
            # Other branches don't count, since their pushes are not scanned.
            range="${SHA} --not ${default}"
            cfg_ref="$default"
          else
            # Force push to the default branch: commits on no other remote branch,
            # with the default rules and no baseline.
            # (--exclude patterns for --remotes are matched against "origin/<branch>".)
            range="${SHA} --not --exclude=origin/${REF_NAME} --exclude=origin/HEAD --remotes=origin"
            cfg_ref=""
          fi

          # gitleaks also reads .gitleaksignore and .gitleaks.toml from the scanned
          # directory, so remove the checked-out copies first.
          rm -f .gitleaksignore .gitleaks.toml
          rules="$RUNNER_TEMP/rules"
          mkdir -p "$rules"
          : > "$rules/.gitleaksignore"
          printf '[extend]\nuseDefault = true\n' > "$rules/.gitleaks.toml"
          found=""
          if [ -n "$cfg_ref" ]; then
            for f in .gitleaks.toml .gitleaksignore; do
              if git cat-file -e "${cfg_ref}:${f}" 2>/dev/null; then
                git show "${cfg_ref}:${f}" > "$rules/$f"
                found="${found} ${f}"
              fi
            done
          fi
          if [ -n "$found" ]; then
            echo "Rules from ${cfg_ref}:${found}"
          else
            echo "Rules: built-in rules, no baseline (none found at '${cfg_ref:-no trusted ref}')"
          fi

          count=$(git rev-list --count $range)
          echo "Scanning ${count} commit(s): git log ${range}"
          git log --oneline -n 50 $range
          if [ "$count" -eq 0 ] && [ "$EVENT" = "push" ]; then
            # Zero commits is only fine when the pushed commit is already on the
            # default branch (and so was scanned there).
            if [ "$REF_NAME" = "$DEFAULT_BRANCH" ] || ! git merge-base --is-ancestor "$SHA" "$default"; then
              echo "::error::The push range resolved to 0 commits, but ${SHA} is not on ${DEFAULT_BRANCH}."
              exit 1
            fi
          fi

          # --text: diff every file as text, whatever .gitattributes or a NUL byte says.
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="--text --diff-merges=remerge $range" \
            --config "$rules/.gitleaks.toml" \
            --gitleaks-ignore-path "$rules/.gitleaksignore" \
            --ignore-gitleaks-allow \
            --redact --no-banner --verbose --exit-code 1
